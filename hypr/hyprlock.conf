# COLOR VAR
$foreground = rgb(192,202,245)
$background = rgb(0,0,0)
$white = rgb(255,255,255)

# BACKGROUND
background {
    monitor =
    #path = screenshot
    path = ~/Wallpaper/wallhaven-5gloj8_1920x1080.png
    color = $background
    blur_passes = 2
    contrast = 1 
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    hide_cursor = true 
}

# INPUT FIELD
input-field {
    monitor =
    size = 400, 70
    outline_thickness = 1
    dots_size = 0.35 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_text_format = *
    outer_color = rgba(255,255,255,0.5)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $white
    font_family = FiraCode Nerd Font Propo 
    fade_on_empty = false
    rounding = 0
    check_color = rgb(204, 136, 34)
    placeholder_text = Input Password
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}
