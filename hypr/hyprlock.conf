# COLOR VAR
$foreground = rgb(192,202,245)

# BACKGROUND
background {
    monitor =
    #path = screenshot
    path = /home/guinhas/.cache/current_wallpaper.png
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 450, 60
    outline_thickness = 3
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.45 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(192,202,245,0.3)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $foreground
    font_family = CaskaydiaCove Nerd Font
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <span foreground="##cdd6f4" size="13000">Input Password</span>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}





